name: Native checkpoint reproducibility
on:
  workflow_dispatch:
  push:
    branches: [native-checkpoint]
    paths: [native/**, tools/build-network-physics.mjs, .github/workflows/native-checkpoint.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild the pinned online core without changing the offline core
        run: |
          mkdir -p evidence/native-checkpoint
          docker run --rm -v "$PWD:/src" -w /src emscripten/emsdk:4.0.10 node tools/build-network-physics.mjs | tee evidence/native-checkpoint/build.log
      - name: Reject unreproducible generated files
        run: git diff --exit-code -- public/physics/rocketsim-network.js public/physics/rocketsim-network.wasm public/physics/rocketsim-network-build.json src/physics/network-core.js
      - name: Original asset integrity and native checkpoint regressions
        run: |
          npm run verify
          node --test tests/netcode/native-checkpoint.mjs | tee evidence/native-checkpoint/tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reproducibility-${{ github.run_id }}
          path: evidence/native-checkpoint
          retention-days: 7
